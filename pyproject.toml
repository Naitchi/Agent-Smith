[project]
name = "agent-smith"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "pydantic>=2.0",
    "mcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "dill>=0.3",
]

[project.scripts]
sandbox = "src.sandbox:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
