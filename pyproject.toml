[project]
name = "agent-smith"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "pydantic>=2.0",
    "mcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "dill>=0.3",
    "mcp-types>=2.0.0",
    "docker>=7.2.0",
]

[project.scripts]
sandbox = "src.sandbox.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "schemas", "agent_mbpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The sandbox is an isolation boundary: it runs untrusted code and bridges
# to an external MCP process, so broad `except Exception` is intentional.
# Same for mcp_tools_mbpp
"src/sandbox/core.py" = ["BLE001", "S102"]
"src/sandbox/namespace.py" = ["BLE001"]
"src/sandbox/mcp_bridge.py" = ["BLE001"]
"src/sandbox/cli.py" = ["BLE001"]
"mcp_tools_mbpp.py" = ["BLE001", "S102"]
"mcp_tools_swebench.py" = ["BLE001", "S102"]
